name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: "18"
            release_surface: false
          - node_version: "lts/*"
            release_surface: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Audit production dependencies
        if: matrix.release_surface
        run: npm audit --omit=dev

      - name: Inspect npm package contents
        if: matrix.release_surface
        # `check` already built dist in this job; skip prepack to avoid running it twice.
        run: npm pack --dry-run --ignore-scripts
